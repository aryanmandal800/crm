# /etc/nginx/sites-available/fivopay-crm   (TLS via certbot --nginx)
server {
  listen 80;
  server_name crm.fivopay.com;
  client_max_body_size 20m;            # CSV imports are chunked client-side; this is headroom
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, don't append (audit log IPs)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
