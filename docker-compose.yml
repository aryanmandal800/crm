# docker compose up -d   →  then once:  docker compose exec app npm run db:seed
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: fivopay_crm, POSTGRES_USER: fivopay, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fivopay"], interval: 10s, retries: 5 }
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { DATABASE_URL: "postgresql://fivopay:${DB_PASSWORD}@db:5432/fivopay_crm" }
    ports: ["127.0.0.1:3000:3000"]   # expose via Nginx/HTTPS only
    depends_on: { db: { condition: service_healthy } }
    volumes: [backups:/app/backups]
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { DATABASE_URL: "postgresql://fivopay:${DB_PASSWORD}@db:5432/fivopay_crm" }
    command: ["npx", "tsx", "scripts/worker.ts"]
    depends_on: { app: { condition: service_started } }
    volumes: [backups:/app/backups]
volumes: { pgdata: {}, backups: {} }
